<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F3EA">
<style>html{color-scheme:light}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gmers Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: panduan alur di kiri (layar lebar), ponsel interaktif di tengah. Palet mengikuti mockup Gmers. */
:root{
  --stage:#E7E1D3; --bg:#F7F3EA; --card:#FFFFFF; --ink:#1B2A2F; --muted:#5E6D70; --line:#E4DDCC;
  --accent:#0F6B63; --on-accent:#FFFFFF; --deep:#0F3D3E; --coral:#C7401C; --gold:#F2B33D;
  --good:#2E8B57; --warn:#D99A12; --bad:#C7401C; --tile:#FBF8F0; --tile-pip:#1B2A2F; --soft:#EFE8D8;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#091213; --bg:#0F1D1E; --card:#162A2B; --ink:#EDE9DE; --muted:#9DB0B1; --line:#28423F;
  --accent:#3FB5A8; --on-accent:#06201E; --deep:#0F3D3E; --coral:#F0794F; --gold:#F2B33D;
  --good:#4CC38A; --warn:#E8B230; --bad:#F0794F; --soft:#1D3436; color-scheme:dark;}}
:root[data-theme="dark"]{
  --stage:#091213; --bg:#0F1D1E; --card:#162A2B; --ink:#EDE9DE; --muted:#9DB0B1; --line:#28423F;
  --accent:#3FB5A8; --on-accent:#06201E; --deep:#0F3D3E; --coral:#F0794F; --gold:#F2B33D;
  --good:#4CC38A; --warn:#E8B230; --bad:#F0794F; --soft:#1D3436; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.stage{height:100%;display:flex;gap:32px;justify-content:center;align-items:center}
.guide{width:268px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.guide h1{font-size:22px;font-weight:800;line-height:1.15;text-wrap:balance}
.guide p{color:var(--muted);font-size:13px}
.guide .gs{display:flex;flex-direction:column;gap:8px}
.guide .gs button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600;font-size:13px}
.guide .gs button:hover{border-color:var(--accent)}
.guide .gs small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.guide .ghost{color:var(--muted);text-decoration:underline;font-size:12px;align-self:flex-start}
.phone{width:390px;height:min(100%,844px);display:flex;flex-direction:column;overflow:hidden;position:relative;
  background:var(--bg);border:1px solid var(--line);border-radius:34px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
@media (max-width:900px){.guide{display:none}}
@media (max-width:560px){.phone{width:100%;border-radius:22px}}
#view{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
#view>*{flex-shrink:0}
.ic{flex:none}
/* tab bar */
#nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 6px 10px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
#nav button.on{color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
/* generic */
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
.top .grow{flex:1;min-width:0}
.top b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ibtn.fill{background:var(--coral);color:#fff}
.title{font-size:24px;font-weight:800;letter-spacing:-.01em}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.lb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.siap,.dot.g{background:var(--good)} .dot.sibuk,.dot.y{background:var(--warn)} .dot.senyap{background:#8B7BB5} .dot.r{background:var(--bad)} .dot.dnd{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;min-height:44px}
.btn.coral{background:var(--coral);color:#fff}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:var(--card)}
.seg button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
/* chat list */
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:hover{background:var(--soft)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:flex;gap:6px;align-items:center;font-size:15px}
.row .mid p{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:var(--muted)}
.unread{background:var(--coral);color:#fff;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-weight:700;font-size:11px;padding:0 6px}
.recb{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-weight:700;font-size:12px;background:var(--card);font-variant-numeric:tabular-nums}
.recb i{width:10px;height:10px;border-radius:50%;background:var(--bad);display:block}
.recb.on{border-color:var(--bad);color:var(--bad)}.recb.on i{border-radius:2px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.stat{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-weight:700;font-size:12px;background:var(--card)}
/* chat view */
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.m{max-width:80%;padding:9px 12px;border-radius:16px;display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line)}
.m i{font-size:10px;color:var(--muted);font-style:normal;align-self:flex-end}
.m.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-color:transparent}
.m.me i{color:inherit;opacity:.75}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--soft);padding:4px 10px;border-radius:99px}
.inv{width:86%;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.inv.me{align-self:flex-end}
.inv .hd{display:flex;gap:10px;align-items:center}
.inv .hd b{font-size:15px}
.inv .hd small{display:block;color:var(--muted);font-size:12px}
.inv .acts{display:flex;gap:6px;flex-wrap:wrap}
.inv .state{font-size:12.5px;color:var(--muted)}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center;flex:none}
.composer input,.rinput input{flex:1;min-width:0;height:42px;border-radius:21px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font:inherit}
/* games */
.gcard{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.gcard .gh{display:flex;gap:12px;align-items:center}
.gcard .gh b{font-size:18px;font-weight:800;display:block}
.gcard .gh small{color:var(--muted)}
.gcard .ga{display:flex;gap:8px}
.gcard .ga .btn{flex:1}
.premium{background:var(--deep);color:#F7F3EA;border-color:transparent}
.premium small,.premium p{color:#C9DDD9}
.progress{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--gold);border-radius:5px}
.cur{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cur div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.cur b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.cur small{color:var(--muted);font-size:11.5px}
.ladder{display:flex;flex-direction:column;gap:6px}
.ladder div{display:flex;justify-content:space-between;padding:9px 12px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.ladder div.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent);font-weight:800}
.shop{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:0}
.shop .mid{flex:1}
/* sheet + toast */
#sheet{position:absolute;inset:0;background:rgba(8,18,18,.5);display:flex;align-items:flex-end;z-index:20}
#sheet .sh{width:100%;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px 22px;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
#sheet h3{font-size:19px;font-weight:800}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#toast{position:absolute;left:16px;right:16px;top:12px;z-index:30;background:var(--deep);color:#F7F3EA;border-radius:14px;padding:11px 14px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.opt{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);width:100%;text-align:left}
.opt.on{border-color:var(--accent);background:var(--soft)}
.opt b{display:block}
.opt small{color:var(--muted)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);width:100%;text-align:left;background:var(--card)}
.switch .tg{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.switch .tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on .tg{background:var(--accent)} .switch.on .tg::after{left:19px}
/* room */
.room{display:flex;flex-direction:column;flex:1;min-height:0}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px}
.pchip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);position:relative;min-width:0}
.pchip.turn{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.pchip.talk .avw{box-shadow:0 0 0 3px var(--good);animation:talk .9s infinite alternate}
.pchip b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip small{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center}
.pchip.nudge{animation:wig .6s}
@keyframes talk{from{box-shadow:0 0 0 2px var(--good)}to{box-shadow:0 0 0 5px color-mix(in srgb,var(--good) 30%,transparent)}}
@keyframes wig{20%{transform:translateX(-4px) rotate(-3deg)}40%{transform:translateX(4px) rotate(3deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.lboard{width:100%;display:block;border-radius:14px}
.boardwrap{padding:0 12px}
.tok{transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.tok .ring{fill:none;stroke:var(--gold);stroke-width:1.3;opacity:0}
.tok.can{cursor:pointer}
.tok.can .ring{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{stroke-width:2.4}}
.diceRow{display:flex;align-items:center;gap:14px;padding:10px 16px}
.die{--die-bg:#FFFFFF;--die-pip:#1B2A2F;width:60px;height:60px;border-radius:14px;background:var(--die-bg);border:2px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.die.jati{--die-bg:#8A5A2B;--die-pip:#F6E7C8} .die.batik{--die-bg:#1F3A5F;--die-pip:#F2B33D} .die.neon{--die-bg:#101820;--die-pip:#39FFB0}
.die i{width:100%;height:100%;border-radius:50%}
.die i.p{background:var(--die-pip);transform:scale(.8)}
.die.go{outline:3px solid var(--gold);cursor:pointer}
.say{flex:1;font-weight:600;font-size:13.5px}
.comms{border-top:1px solid var(--line);padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.modes button{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;padding:8px 4px;border-radius:12px;font-weight:700;font-size:12.5px;border:1.5px solid var(--line);background:var(--card)}
.modes button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.modes{display:flex;gap:6px}
.netrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.netrow .grow{flex:1;min-width:120px}
.rlog{display:flex;flex-direction:column;gap:3px;font-size:13px;min-height:20px}
.rlog b{font-weight:800}
.rinput{display:flex;gap:8px}
.react{display:flex;gap:6px;flex-wrap:wrap}
.react button{padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:12.5px}
.banner{margin:0 12px;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:12.5px;color:var(--muted)}
/* gaple */
.chain{margin:0 12px;background:var(--deep);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;min-height:150px}
.dm{background:var(--tile);border-radius:6px;display:flex;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.25);flex:none}
.dm .pf{display:block;fill:var(--tile-pip)}
.dm .h{width:26px;height:26px;display:grid}
.dm i{background:#B7AE98;flex:none;width:1.5px;height:20px}
.dm.v{flex-direction:column;border-radius:7px}
.dm.v i{width:20px;height:1.5px}
.dm.big .h{width:34px;height:34px}
.dm.big i{height:26px}.dm.v.big i{width:26px;height:1.5px}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 12px}
.hand button.dm.ok{outline:3px solid var(--gold);outline-offset:1px}
.hand button.dm.dim{opacity:.45}
.hand button.dm.sel{transform:translateY(-6px)}
.ends{display:flex;justify-content:space-between;margin:6px 14px 0;font-size:12px;color:var(--muted);font-weight:700}
.sides{display:flex;gap:8px;padding:0 12px}
.sides .btn{flex:1}
.avw{position:relative;border-radius:50%;flex:none;display:block}
.avw>svg{width:100%;height:100%;border-radius:50%;display:block}
.bdg{position:absolute;right:-3px;bottom:-3px;border-radius:50%;background:var(--bg);padding:1.5px;display:block}
.bdg svg{display:block;width:100%;height:100%}
.top small{overflow:hidden;white-space:nowrap}
.sin{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;width:100%}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.egrid button{font-size:26px;padding:6px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);line-height:1.2}
.egrid.lock button{opacity:.4;filter:grayscale(1)}
.m.big{background:transparent;border-color:transparent}
.m.big span{font-size:36px;line-height:1.1}
.avpick{border-radius:18px;padding:8px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;gap:4px;font-size:11px;font-weight:700}
.avpick.on{border-color:var(--accent);background:var(--soft)}
#call{position:absolute;inset:0;z-index:25;background:var(--deep);color:#F7F3EA;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:56px 24px 36px;text-align:center}
#call .nm{font-size:24px;font-weight:800}
#call .sub{color:#C9DDD9;font-variant-numeric:tabular-nums}
#call .cbs{display:flex;gap:18px;align-items:flex-start}
#call .cb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#C9DDD9}
#call .cb span{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
#call .cb.on span{background:#F7F3EA;color:#0F3D3E}
#call .cb.end span{background:#C7401C}
#call .pulse{animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(242,179,61,.5)}100%{box-shadow:0 0 0 26px rgba(242,179,61,0)}}
#call .self{position:absolute;right:20px;top:20px;width:76px;height:100px;border-radius:14px;background:#164E4F;display:grid;place-items:center;font-size:11px;color:#C9DDD9}
.fab{position:absolute;right:16px;bottom:84px;z-index:10;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.fab:active{transform:scale(.96)}
.ktabs{display:flex;gap:6px;padding:10px 14px 0}
.ktabs button{flex:1;padding:9px;border-radius:12px;font-weight:700;font-size:13px;border:1.5px solid var(--line);background:var(--card)}
.ktabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cchips,.meet{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.cchips::-webkit-scrollbar,.meet::-webkit-scrollbar{display:none}
.cchips button{flex:none;display:flex;gap:6px;align-items:center;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:12.5px}
.cchips button.on{background:var(--deep);color:#F7F3EA;border-color:var(--deep)}
.sect{display:flex;justify-content:space-between;align-items:baseline;padding:6px 16px 0}
.mcard{flex:none;width:138px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.mcard b{font-size:13.5px}.mcard small{color:var(--muted);font-size:11.5px;line-height:1.25;min-height:28px}
.post{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.post .ph{display:flex;gap:10px;align-items:center}
.post .ph .who{flex:1;min-width:0;text-align:left}
.post .ph b{font-size:14.5px;display:flex;gap:6px;align-items:center}
.post .ph small{color:var(--muted);font-size:12px}
.post .ptag{color:var(--accent);font-weight:700}
.pt{font-size:15px;line-height:1.45}
.media{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:16/10;background:var(--soft)}
.media svg,.media img{width:100%;height:100%;object-fit:cover;display:block}

function applyResult(rank,room){
 const out={lines:[]};
 S.bintang+=5;out.lines.push('+5 Bintang');
 if(room.ranked){
  const d=[10,4,-2,-5][rank-1],floor=leagueOf(S.trophy)[1],before=S.trophy;
  let n=S.trophy+d;if(d<0)n=Math.max(floor,n);
  if(!S.daily){n+=2;S.daily=true;out.lines.push('+2 bonus game pertama hari ini')}
  S.trophy=n;const diff=n-before;
  out.lines.unshift(`${diff>=0?'+':''}${diff} trofi (${S.trophy} sekarang)`);
  if(leagueOf(n)[0]!==leagueOf(before)[0])out.lines.push('Naik ke kelas '+leagueOf(n)[0]);
  if(d<0&&n===floor&&before+d<floor)out.lines.push('Lantai kelas melindungi trofimu');
 }else out.lines.unshift('Game santai: trofi tidak berubah');
 if(room.ranked&&rank===1){S.winProg++;if(S.winProg>=WINS){S.winProg=0;S.tiket++;out.lines.push('+1 Tiket dari '+WINS+' kemenangan Ranked')}else out.lines.push('Kemenangan Ranked '+S.winProg+'/'+WINS+' menuju 1 Tiket')}
 const fid=room.friend;
 if(fid&&S.streak[fid]!==undefined&&!room.streakDone){S.streak[fid]++;out.lines.push(`Streak dengan ${FR[fid].s} naik jadi ${S.streak[fid]} hari`)}
 else if(fid&&FR[fid]&&!FR[fid].group&&S.streak[fid]===undefined){S.streak[fid]=1;out.lines.push(`Streak baru dengan ${FR[fid].s}`)}
 return out;
}

 PATH.forEach((p,i)=>{const sd=SEATS.findIndex(x=>x.start===i);s+=`<rect x="${p[1]*10}" y="${p[0]*10}" width="10" height="10" fill="${sd>=0?SEATS[sd].c:'var(--card)'}" stroke="var(--line)" stroke-width=".4"/>`;if(SAFE.has(i)&&sd<0)s+=`<path d="M${p[1]*10+5} ${p[0]*10+2.2}l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="var(--muted)" opacity=".6"/>`});
 SEATS.forEach(st=>st.home.forEach(h=>{s+=`<rect x="${h[1]*10}" y="${h[0]*10}" width="10" height="10" fill="${st.c}" fill-opacity=".6" stroke="var(--line)" stroke-width=".4"/>`}));
 s+=`<polygon points="60,60 60,90 75,75" fill="${SEATS[0].c}"/><polygon points="60,60 90,60 75,75" fill="${SEATS[1].c}"/><polygon points="90,60 90,90 75,75" fill="${SEATS[2].c}"/><polygon points="60,90 90,90 75,75" fill="${SEATS[3].c}"/>`;
 for(let sd=0;sd<4;sd++)for(let t=0;t<4;t++)s+=`<g class="tok" id="tk${sd}_${t}" ${sd===0?`data-act="ludoMove" data-i="${t}"`:''}><circle class="ring" r="5.6"/><circle r="3.8" fill="${SEATS[sd].c}" stroke="#fff" stroke-width="1.1"/><circle r="1.3" fill="#fff" fill-opacity=".55"/></g>`;
 return s+'</svg>';
}
function tokXY(sd,t){
 const p=R.g.tok[sd][t],st=SEATS[sd];
 if(p===-1){const y=st.yard[t];return[y[1]*10,y[0]*10,'y'+sd+t]}
 if(p<=50){const c=PATH[(st.start+p)%52];return[c[1]*10+5,c[0]*10+5,'p'+((st.start+p)%52)]}
 if(p<=55){const c=st.home[p-51];return[c[1]*10+5,c[0]*10+5,'h'+sd+(p-51)]}
 return[75+[-4,0,4,0][sd],75+[0,-4,0,4][sd]+((t%2)?1.5:-1.5),'f'+sd+t];
}
function placeTokens(){
 const g=R.g,pos=[],groups={};
 for(let sd=0;sd<4;sd++)for(let t=0;t<4;t++){const q=tokXY(sd,t);pos.push({sd,t,x:q[0],y:q[1]});(groups[q[2]]=groups[q[2]]||[]).push(pos[pos.length-1])}
 Object.values(groups).forEach(a=>a.forEach((o,k)=>{o.x+=a.length>1?(k-(a.length-1)/2)*2.6:0}));
 pos.forEach(o=>{const el=$('#tk'+o.sd+'_'+o.t);if(!el)return;el.style.transform=`translate(${o.x}px,${o.y}px)`;
  const can=o.sd===0&&g.turn===0&&!R.spec&&g.phase==='move'&&g.legal.includes(o.t);el.classList.toggle('can',can)});
}
function dieFace(v){return dieCells(v)}
function setDie(v){const d=$('#die');if(d){d.innerHTML=dieFace(v||0);d.classList.toggle('go',!!(R.g&&R.g.turn===0&&!R.spec&&R.g.phase==='roll'&&!R.over))}}
function say(t){const e=$('#say');if(e)e.textContent=t}
function ludoStart(){
 R.g={tok:[0,1,2,3].map(()=>[-1,-1,-1,-1]),turn:0,roll:0,phase:'roll',legal:[],over:false};
 $('#board').innerHTML=`<div class="boardwrap">${ludoSvg()}</div><div class="diceRow"><button class="die ${S.skin}" id="die" data-act="ludoRoll" aria-label="Lempar dadu"></button><div class="say" id="say"></div></div>`;
 placeTokens();setDie(0);paintHud();if(R.spec){say('Menonton: giliran '+nm(0));tm(ludoRoll,1500)}else say('Giliranmu. Keluarkan bidak dengan dadu 6. Ketuk dadu untuk melempar.');
}
const legalL=(seat,r)=>{const out=[];R.g.tok[seat].forEach((p,i)=>{if(p===-1){if(r===6)out.push(i)}else if(p+r<=56)out.push(i)});return out};
function capAt(seat,np){if(np>50||np<0)return false;const idx=(SEATS[seat].start+np)%52;if(SAFE.has(idx))return false;return R.g.tok.some((ts,s)=>s!==seat&&ts.some(q=>q>=0&&q<=50&&(SEATS[s].start+q)%52===idx))}
function ludoRoll(){
 const g=R.g;if(!g||g.over||g.phase!=='roll')return;
 g.phase='rolling';setDie(0);let n=0;
 const spin=()=>{const d=$('#die');if(d)d.innerHTML=dieFace(1+Math.floor(Math.random()*6));if(++n<7)tm(spin,70);else fin()};
 const fin=()=>{
  const r=1+Math.floor(Math.random()*6);g.roll=r;setDie(r);g.legal=legalL(g.turn,r);
  if(!g.legal.length){say(`${nm(g.turn)} dapat ${r}, tidak ada langkah`);tm(nextTurn,1100);return}
  if(g.turn===0&&!R.spec){g.phase='move';placeTokens();
   if(g.legal.length===1){say(`Kamu dapat ${r}. Satu-satunya langkah, jalan otomatis.`);tm(()=>ludoMove(g.legal[0]),800)}
   else say(`Kamu dapat ${r}. Pilih bidak yang menyala.`);
  }else{g.phase='move';say(`${nm(g.turn)} melempar ${r}`);tm(()=>ludoMove(simPick()),900)}
 };
 spin();
}
function simPick(){
 const g=R.g,s=g.turn;let best=g.legal[0],bs=-1;
 g.legal.forEach(t=>{const p=g.tok[s][t],np=p===-1?0:p+g.roll;let sc=np;if(capAt(s,np))sc+=100;if(np===56)sc+=80;if(p===-1)sc+=50;if(sc>bs){bs=sc;best=t}});
 return best;
}
function progress(s){return R.g.tok[s].reduce((a,p)=>a+Math.max(p+1,0),0)}
function ludoMove(ti){
 const g=R.g;if(!g||g.over||g.phase!=='move'||!g.legal.includes(ti))return;
 const seat=g.turn,r=g.roll,arr=g.tok[seat];
 g.phase='busy';g.legal=[];
 const p=arr[ti],np=p===-1?0:p+r;arr[ti]=np;
 let cap=false;
 if(np<=50){const idx=(SEATS[seat].start+np)%52;if(!SAFE.has(idx))g.tok.forEach((ts,s)=>{if(s===seat)return;ts.forEach((q,k)=>{if(q>=0&&q<=50&&(SEATS[s].start+q)%52===idx){ts[k]=-1;cap=true}})})}
 placeTokens();paintHud();
 if(arr.every(x=>x===56)){
  g.over=true;const others=[0,1,2,3].filter(s=>s!==seat).sort((a,b)=>progress(b)-progress(a));
  const order=[seat,...others];R.detail=[0,1,2,3].map(s=>s===seat?'Selesai':progress(s)+'/16 langkah');
  say(`${nm(seat)} menyelesaikan semua bidak`);tm(()=>showResult(order),900);return;
 }
 const done=np===56;
 if(cap)say(`${nm(seat)} menangkap bidak lawan!`);else if(done)say(`${nm(seat)} memasukkan satu bidak ke tengah`);
 const extra=r===6||cap||done;
 tm(()=>{
  if(extra){g.phase='roll';paintHud();setDie(r);if(seat===0&&!R.spec)say('Giliran tambahan. Lempar lagi.');else{say(`${nm(seat)} dapat giliran tambahan`);tm(ludoRoll,900)}}
  else nextTurn();
 },900);
}
function nextTurn(){
 const g=R.g;if(!g||g.over)return;
 g.turn=(g.turn+1)%4;g.phase='roll';g.legal=[];placeTokens();paintHud();setDie(0);
 if(g.turn===0&&!R.spec)say('Giliranmu. Ketuk dadu untuk melempar.');
 else{say(`Giliran ${nm(g.turn)}`);tm(ludoRoll,900)}
}

/* ===== gaple ===== */
const pips=t=>t.a+t.b;
const ends=()=>{const c=R.g.chain;return[c[0].a,c[c.length-1].b]};
const sidesOf=t=>{const[L,Rr]=ends(),s=[];if(t.a===L||t.b===L)s.push('L');if(t.a===Rr||t.b===Rr)s.push('R');return s};
function gapleStart(){
 const tiles=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)tiles.push({a,b});
 shuffle(tiles);const hands=[0,1,2,3].map(i=>tiles.slice(i*7,i*7+7));
 const h=hands.findIndex(hd=>hd.some(t=>t.a===6&&t.b===6));
 const k=hands[h].findIndex(t=>t.a===6&&t.b===6);hands[h].splice(k,1);
 hands[0].sort((x,y)=>pips(y)-pips(x));
 R.g={hands,chain:[{a:6,b:6}],turn:(h+1)%4,passes:0,sel:null,over:false};
 $('#board').innerHTML='<div id="gb"></div>';
 paintGaple();paintHud();
 say(`${nm(h)} membuka dengan 6|6`);
 if(R.spec||R.g.turn!==0)tm(gapleSim,1300);else gapleCheckMe();
}
function myLegal(){return R.g.hands[0].map((t,i)=>sidesOf(t).length?i:-1).filter(i=>i>=0)}
function paintGaple(){
 const g=R.g,[L,Rr]=ends(),myTurn=g.turn===0&&!g.over&&!R.spec,leg=myLegal();
 const hand=g.hands[0].map((t,i)=>`<button class="dm v big ${myTurn?(leg.includes(i)?'ok':'dim'):''} ${g.sel===i?'sel':''}" data-act="gaplePlay" data-i="${i}" aria-label="Kartu ${t.a} ${t.b}"><div class="h">${face(t.a)}</div><i></i><div class="h">${face(t.b)}</div></button>`).join('');
 let choose='';
 if(g.sel!==null)choose=`<div class="sides"><button class="btn" data-act="gapleSide" data-v="L">Pasang di kiri (${L})</button><button class="btn" data-act="gapleSide" data-v="R">Pasang di kanan (${Rr})</button></div>`;
 $('#gb').innerHTML=`<div class="ends"><span>Ujung kiri: ${L}</span><span>Ujung kanan: ${Rr}</span></div>
 <div class="chain" style="margin-top:6px">${g.chain.map(t=>domino(t,t.a===t.b?'v':'')).join('')}</div>
 <div class="diceRow" style="padding-bottom:4px"><div class="say" id="say"></div>${R.spec?'':`<button class="btn sm ${myTurn&&!leg.length?'coral':'line'}" data-act="gaplePass" ${myTurn&&!leg.length?'':'disabled'}>Lewat</button>`}</div>
 ${R.spec?'':choose+'<div class="hand">'+hand+'</div>'}`;
}
function gapleCheckMe(){
 const g=R.g;paintGaple();
 if(g.turn===0&&!g.over){say(myLegal().length?'Giliranmu. Pilih kartu yang menyala.':'Tidak ada kartu yang cocok. Ketuk Lewat.')}
}
function gaplePlace(seat,ti,side){
 const g=R.g,[L,Rr]=ends(),t=g.hands[seat].splice(ti,1)[0];
 if(side==='L')g.chain.unshift(t.b===L?{a:t.a,b:t.b}:{a:t.b,b:t.a});
 else g.chain.push(t.a===Rr?{a:t.a,b:t.b}:{a:t.b,b:t.a});
 g.passes=0;g.sel=null;
 return `${nm(seat)} memasang ${t.a}|${t.b}`;
}
function gapleAfter(seat,msg){
 const g=R.g;paintHud();
 if(!g.hands[seat].length){return gapleEnd(seat,false)}
 g.turn=(g.turn+1)%4;paintGaple();say(msg);paintHud();
 if(g.turn===0&&!R.spec)tm(gapleCheckMe,600);else tm(gapleSim,1200);
}
function gapleSim(){
 const g=R.g;if(!g||g.over)return;const s=g.turn,h=g.hands[s];
 let best=-1,bp=-1;h.forEach((t,i)=>{if(sidesOf(t).length&&pips(t)>bp){bp=pips(t);best=i}});
 if(best<0){g.passes++;if(g.passes>=4)return gapleEnd(s,true);return gapleAfter(s,`${nm(s)} lewat`)}
 const side=sidesOf(h[best])[0];gapleAfter(s,gaplePlace(s,best,side));
}
function gapleEnd(seat,blocked){
 const g=R.g;g.over=true;paintGaple();
 const sum=s=>g.hands[s].reduce((a,t)=>a+pips(t),0);
 const order=[0,1,2,3].sort((a,b)=>sum(a)-sum(b)||a-b);
 R.detail=[0,1,2,3].map(s=>sum(s)+' poin sisa');
 say(blocked?'Permainan buntu. Poin sisa terendah menang.':`${nm(seat)} menghabiskan kartu`);
 tm(()=>showResult(order),1000);
}

 liveJoin(d){const r=[['gaple'],['gaple'],['gaple']];const g=['ludo','gaple','gaple'][d.i],m=['suara','chat','senyap'][d.i];askMode(m,'Gabung '+GAMES[g].name,'Satu kursi kosong menunggumu.',mode=>openRoom({game:g,mode,ranked:false,live:true}))},
 coinSheet(){sheetCoin()},
 buyPack(d){PACK=PACKS[d.i];openSheet(`<div class="grip"></div><h3>Konfirmasi pembelian</h3><div class="card" style="display:flex;gap:12px;align-items:center">${coinIc(32)}<div style="flex:1"><b>${PACK[1]} Koin</b><div class="muted">${rp(PACK[0])}</div></div></div><p class="muted">Pembayaran lewat Google Play atau App Store. Ini simulasi, tidak ada uang yang dipotong.</p><button class="btn block" data-act="payOk">Bayar ${rp(PACK[0])}</button><button class="btn line block" data-act="coinSheet">Pilih paket lain</button>`)},
 payOk(){S.coin+=PACK[1];closeSheet();toast(`Koin bertambah ${PACK[1]}`);render()},
 buySkin(d){const k=SKINS[d.k];if(S.coin<k.c){toast('Koin kurang. Isi Koin dulu.');sheetCoin();return}S.coin-=k.c;S.owned[d.k]=1;S.skin=d.k;toast('Skin dadu '+k.n+' dipakai');render()},
 useSkin(d){S.skin=d.k;toast('Skin dadu '+SKINS[d.k].n+' dipakai');render()},
 /* room */
 roomMode(d){
  if(d.v==='suara'&&R.net[0]==='r'){toast('Jaringan merah, suara belum bisa dipakai');return}
  R.mode=d.v;paintSub();paintComms();paintHud();toast('Mode room: '+modeLbl(d.v));
 },
 mute(){R.mute=!R.mute;paintComms();paintHud()},
 net(){
  const o=R.net[0],n={g:'y',y:'r',r:'g'}[o];R.net[0]=n;
  if(n==='r'&&R.mode==='suara'){R.mode='chat';R.msgs.push({who:'Sistem',text:'Suara dimatikan karena jaringan lemah. Game tetap jalan di Chat.'});toast('Suara mati, pindah ke Chat otomatis')}
  else if(n==='y')toast('Jaringan sedang: kualitas suara diturunkan');
  else if(n==='g')toast('Jaringan pulih. Kamu bisa kembali ke Suara.');
  paintSub();paintComms();paintHud();
 },
 react(d){R.react.push('Kamu: '+d.t);R.react=R.react.slice(-3);paintComms();toast('Terkirim sebagai tampilan saja')},
 nudge(d){R.nudgeUntil=Date.now()+30000;const c=$('#pc'+d.i);if(c){c.classList.remove('nudge');void c.offsetWidth;c.classList.add('nudge')}paintComms();toast(`${R.names[d.i]} disundul, hanya terlihat di layar`)},
 liveWatch(d){const r=LIVE[+d.i];openRoom({game:r.game,mode:'chat',spec:true,names:r.names,viewers:r.v,specRow:+d.i,live:true})},
 specJoin(){const i=R.specRow;endRoom();S.scr='tab';S.tab='live';render();A.liveJoin({i})},
 specCheer(d){R.msgs.push({who:'Kamu',text:d.t});paintLog()},
 roomSend(){const i=$('#rin');const v=i.value.trim();if(!v)return;i.value='';R.msgs.push({who:'Kamu',text:v});paintLog();
  tm(()=>{R.msgs.push({who:R.spec?rnd(['Kevin','Maya','Andi']):rnd(R.names.slice(1)),text:rnd(['Sabar ya','Wah hampir!','Ayo lanjut','Hehe'])});paintLog()},1300)},
 leave(){
  if(R.over||R.spec){A.leaveYes();return}
  openSheet(`<div class="grip"></div><h3>Keluar dari room?</h3><p class="muted">${R.ranked?'Di Ranked, keluar di tengah game dihitung kalah.':'Game santai tidak mengubah trofi.'}</p><div class="seg"><button data-act="closeSheetBtn">Tetap main</button><button class="on" data-act="leaveYes">Keluar</button></div>`);
 },
 closeSheetBtn(){closeSheet()},
 leaveYes(){closeSheet();if(R&&R.bet&&!R.over&&!R.betDone)toast('Keluar sebelum selesai: 1 Tiket taruhan hangus ke '+R.names[1]);endRoom();S.scr=R_back==='comm'?'comm':(S.chatId&&R_friend?'chat':'tab');if(S.scr==='tab')S.tab=R_spec?'live':'games';render()},
 again(){closeSheet();const o={game:R.game,mode:R.mode,ranked:R.ranked,live:R.live,friend:R.friend,random:R.random,back:R.back};endRoom();openRoom(o)},
 ludoRoll(){if(R&&R.g&&!R.spec&&R.g.turn===0)ludoRoll()},
 ludoMove(d){if(R&&R.g&&!R.spec&&R.g.turn===0)ludoMove(+d.i)},
 gaplePlay(d){
  const g=R.g,i=+d.i;if(g.turn!==0||g.over)return;
  const sd=sidesOf(g.hands[0][i]);
  if(!sd.length){toast('Kartu ini belum cocok dengan ujung rantai');return}
  const[L,Rr]=ends();
  if(sd.length===2&&L!==Rr){g.sel=i;paintGaple();say('Kartu ini cocok di dua sisi. Pilih sisi.');return}
  gapleAfter(0,gaplePlace(0,i,sd[0]));
 },
 gapleSide(d){const g=R.g;if(g.sel===null)return;const i=g.sel;gapleAfter(0,gaplePlace(0,i,d.v))},
 gaplePass(){const g=R.g;if(g.turn!==0||myLegal().length)return;g.passes++;if(g.passes>=4)return gapleEnd(0,true);gapleAfter(0,'Kamu lewat')},
 guide(d){
  S.ready=true;killCall();A.leaveYesQuiet();S.scr='tab';
  if(d.n==='1'){S.scr='chat';S.chatId='bayu';S.chats.bayu.unread=0;render()}
  else if(d.n==='2'){S.scr='chat';S.chatId='rina';render();A.ajak();SH.game='ludo'}
  else if(d.n==='3'){S.tab='games';render();A.ranked({g:'ludo'})}
  else if(d.n==='4'){S.tab='games';render();askMode('suara','Ludo Ranked, mode Suara','Setelah masuk, ketuk Uji jaringan dua kali.',mode=>openRoom({game:'ludo',mode,ranked:true,live:true,random:true}))}
  else if(d.n==='6'){S.scr='chat';S.chatId='rina';render();A.call({v:'voice'})}
  else if(d.n==='7'){S.tab='chat';render();A.newGroupSheet()}
  else if(d.n==='10'){S.tab='komunitas';S.scr='tab';render()}
  else if(d.n==='11'){S.tab='komunitas';S.scr='tab';render();A.compose({})}
  else if(d.n==='9'){S.tab='chat';render();A.skip()}
  else if(d.n==='8'){S.trophy=595;S.daily=false;S.tab='games';render();A.ranked({g:'ludo'})}
  else{S.tab='profil';render();sheetCoin()}
 },
 leaveYesQuiet(){closeSheet();endRoom()},
 reset(){killCall();endRoom();closeSheet();for(const k of Object.keys(FR)){if(/^[gr]\d+$/.test(k))delete FR[k]}S=initState();render()}
};

function viewOnboard(){
 if(S.ob==='login')return `<div class="pad" style="padding-top:44px;gap:18px;min-height:100%"><span class="chip" style="align-self:flex-start">Selamat datang</span>

 <p class="muted" style="font-size:12.5px;text-align:center">Dengan masuk, kamu setuju pada syarat layanan. Kami tidak memposting apa pun atas namamu.</p></div>`;
 if(S.ob==='phone')return `<div class="pad" style="padding-top:28px;gap:16px">${obSteps(1)}
 <h1 style="font-size:26px;line-height:1.15">Masukkan nomor HP</h1>
 <p class="muted">Masuk sebagai <b>faizal@gmail.com</b>. Nomor dipakai untuk mengamankan akun dan mencegah akun ganda. Nomor tidak ditampilkan ke pemain lain.</p>
 <label class="lb" for="ph">Nomor HP</label>
 <div style="display:flex;gap:8px"><span class="sin" style="width:auto;display:flex;align-items:center;font-weight:700">+62</span><input id="ph" class="sin" inputmode="numeric" placeholder="812 3456 7890" value="${esc(S.phone)}" maxlength="14" autocomplete="off" style="flex:1"></div>
 <p id="pherr" class="muted" style="color:var(--coral);min-height:18px"></p>
 <button class="btn block" data-act="obPhone">Kirim kode</button></div>`;
 if(S.ob==='otp')return `<div class="pad" style="padding-top:28px;gap:16px">${obSteps(2)}
 <h1 style="font-size:26px;line-height:1.15">Masukkan kode</h1>
 <p class="muted">Kode 6 angka dikirim ke <b>+62 ${esc(S.phone)}</b>. Untuk demo, kodenya <b>123456</b>.</p>
 <input id="otp" class="sin" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off" style="font-size:24px;letter-spacing:8px;text-align:center">
 <p id="oterr" class="muted" style="color:var(--coral);min-height:18px"></p>
 <button class="btn block" data-act="obOtp">Verifikasi</button>
 <button class="btn line block" data-act="obBack">Ganti nomor</button></div>`;
 return `<div class="pad" style="padding-top:28px;gap:16px">${obSteps(3)}<h1 style="font-size:26px;line-height:1.15">Pilih avatarmu</h1>
 <p class="muted">Avatar ini yang dilihat teman di chat dan room. Semua pemain mulai dari kelas Pemula, lalu naik sampai Raja.</p>
 <div style="display:flex;justify-content:center">${avatarHtml(S.avatar,112,0)}</div>
 <div class="egrid" style="grid-template-columns:repeat(3,1fr);gap:10px">${BASIC.map(id=>`<button class="avpick ${S.avatar===id?'on':''}" data-act="obPick" data-id="${id}" aria-label="Avatar ${id}">${avatarHtml(id,64,-1)}</button>`).join('')}</div>
 <label class="lb" for="oname">Nama panggilan</label><input id="oname" class="sin" value="${esc(S.name)}" maxlength="20" autocomplete="off">
 <p class="muted">Avatar lain, seperti Astronot dan Kucing Belang, dibeli di toko dengan Koin.</p>
 <button class="btn block" data-act="obDone">Mulai main</button></div>`;
}
function render(){
 const v=$('#view'),nav=$('#nav');
 const fab=$('#fab');const kt=S.tab==='komunitas';fab.innerHTML=ic(kt?'pencil':'plus',26);fab.dataset.act=kt?'compose':'newSheet';fab.setAttribute('aria-label',kt?'Tulis postingan':'Chat atau grup baru');fab.hidden=!(S.ready&&S.scr==='tab'&&(S.tab==='chat'||kt));
 if(S.ready&&S.scr!=='room')purgeRooms();

  v.innerHTML={chat:viewChatList,komunitas:viewKomunitas,games:viewGames,live:viewLive,profil:viewProfil}[S.tab]();
  nav.hidden=false;paintNav();

 else if(S.scr==='chat'){v.innerHTML=viewChat();nav.hidden=true;paintMsgs()}

}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act;
 if(a==='bg'){if(e.target===el)closeSheet();return}
 if(A[a])A[a](el.dataset,el);
});

document.addEventListener('input',e=>{if(e.target.id==='csearch'){const l=$('#clist');if(l)l.innerHTML=sheetPeople()}});

 if(e.key!=='Enter')return;
 if(e.target.id==='cin')A.send();
 if(e.target.id==='rin')A.roomSend();

render();
setInterval(()=>{if(S.ready&&S.scr==='tab'&&S.tab==='chat'&&!$('#sheet').offsetParent)render()},30000);

<script>
/* Mode uji Gmers: aktif hanya dengan ?uji=1. Data tersimpan lokal di peramban, tidak dikirim ke mana pun. */
(function(){
var q=new URLSearchParams(location.search);if(q.get('uji')!=='1')return;
var cfg={k:q.get('k')||'',c:q.get('c')||'B',g:q.get('g')||'ringan',p:q.get('p')||'pengundang'};
var ev=[],t0=null,marks={},helps=0,taps=0,note='';
function now(){return t0===null?0:Math.round(performance.now()-t0)}
function scr(){try{return (S.scr||'')+(S.scr==='tab'?':'+(S.tab||''):'')}catch(e){return ''}}
function log(type,act,id,v){if(t0===null&&type!=='marker')return;ev.push({ms:now(),type:type,act:act||'',id:id||'',v:v||'',scr:scr()});if(type==='tap')taps++;save();paint()}
function save(){try{localStorage.setItem('gmers_uji',JSON.stringify({cfg:cfg,ev:ev,marks:marks,helps:helps,note:note}))}catch(e){}}
function mark(n){if(t0===null||marks[n]!==undefined)return;marks[n]=now();log('marker',n);}
function start(){t0=performance.now();ev=[];marks={};helps=0;taps=0;log('marker','mulai');paint()}
document.addEventListener('click',function(e){
 if(!e.isTrusted)return;var el=e.target.closest&&e.target.closest('[data-act]');if(!el||el.closest('#ujipanel'))return;
 var a=el.dataset.act;log('tap',a,el.dataset.id,el.dataset.v);
 if(cfg.p==='pengundang'&&a==='sendInvite')mark('undangan_terkirim');
 if(cfg.p==='penerima'&&a==='joinConfirm')mark('mode_dipilih');
},true);
setInterval(function(){if(t0!==null&&marks.masuk_room===undefined){try{if(S.scr==='room'){mark('masuk_room');}}catch(e){}}},150);
/* mode gamification polos: sembunyikan streak dan progres Tiket */
function hideGami(){if(cfg.g!=='polos')return;
 document.querySelectorAll('.progress').forEach(function(p){if(p.parentElement)p.parentElement.style.display='none'});
 document.querySelectorAll('.chip[style*="coral"]').forEach(function(c){c.style.display='none'})}
new MutationObserver(hideGami).observe(document.documentElement,{childList:true,subtree:true});hideGami();
/* panel */
var css=document.createElement('style');css.textContent='#ujibtn{position:fixed;left:6px;bottom:6px;z-index:99999;width:30px;height:30px;border-radius:15px;border:0;background:#222;color:#fff;opacity:.35;font:700 12px system-ui}#ujipanel{position:fixed;left:6px;bottom:42px;z-index:99999;width:260px;max-width:calc(100vw - 12px);background:#fff;color:#222;border:1px solid #bbb;border-radius:10px;padding:10px;font:12px/1.35 system-ui;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none}#ujipanel.on{display:block}#ujipanel button{font:600 12px system-ui;padding:6px 8px;margin:2px 2px 2px 0;border:1px solid #999;border-radius:6px;background:#f4f4f4;color:#222}#ujipanel input,#ujipanel textarea{width:100%;box-sizing:border-box;font:12px system-ui;margin:2px 0;padding:4px}#ujipanel .r{display:flex;gap:6px}';
document.head.appendChild(css);
var b=document.createElement('button');b.id='ujibtn';b.textContent='U';b.setAttribute('aria-label','Panel uji');
var p=document.createElement('div');p.id='ujipanel';
p.innerHTML='<b>Mode uji</b><div class="r"><input id="uk" placeholder="Kelompok"><input id="uc" placeholder="Cara A/B/C"></div><div class="r"><input id="up" placeholder="Peran"><input id="ug" placeholder="Gamif"></div><div><button id="u1">Mulai</button><button id="u2">Selesai</button><button id="u3">Butuh bantuan +1</button></div><textarea id="un" rows="2" placeholder="Catatan titik macet"></textarea><div id="us" style="margin:4px 0"></div><div><button id="u4">Unduh CSV</button><button id="u5">Salin CSV</button><button id="u6">Reset</button></div>';
document.body.appendChild(b);document.body.appendChild(p);
function $$(i){return document.getElementById(i)}
$$('uk').value=cfg.k;$$('uc').value=cfg.c;$$('up').value=cfg.p;$$('ug').value=cfg.g;
['uk','uc','up','ug'].forEach(function(i){$$(i).addEventListener('input',function(){cfg.k=$$('uk').value;cfg.c=$$('uc').value;cfg.p=$$('up').value;cfg.g=$$('ug').value;save()})});
$$('un').addEventListener('input',function(){note=$$('un').value;save()});
b.onclick=function(){p.classList.toggle('on')};
$$('u1').onclick=start;
$$('u2').onclick=function(){if(t0===null)return;mark('selesai');paint()};
$$('u3').onclick=function(){helps++;log('marker','bantuan');};
$$('u6').onclick=function(){t0=null;ev=[];marks={};helps=0;taps=0;try{localStorage.removeItem('gmers_uji')}catch(e){}paint()};
function s(x){return x===undefined?'-':(x/1000).toFixed(1)+' dtk'}
function paint(){var el=$$('us');if(!el)return;el.textContent='Ketukan: '+taps+' | bantuan: '+helps+' | undangan/mode: '+s(marks.undangan_terkirim!==undefined?marks.undangan_terkirim:marks.mode_dipilih)+' | masuk room: '+s(marks.masuk_room)+' | selesai: '+s(marks.selesai)}
function csv(){var h='kelompok,cara,peran,gamifikasi,ms,jenis,aksi,id,nilai,layar,catatan';var rows=ev.map(function(e){return [cfg.k,cfg.c,cfg.p,cfg.g,e.ms,e.type,e.act,e.id,e.v,e.scr,''].map(esc).join(',')});
 rows.push([cfg.k,cfg.c,cfg.p,cfg.g,'','ringkasan','ketukan='+taps+';bantuan='+helps,'','','',note].map(esc).join(','));return h+'\n'+rows.join('\n')}
function esc(x){x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
$$('u4').onclick=function(){var blob=new Blob([csv()],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uji_'+(cfg.k||'kelompok')+'_'+cfg.c+'_'+cfg.p+'.csv';document.body.appendChild(a);a.click();a.remove()};
$$('u5').onclick=function(){var t=csv();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){})}};
})();
</script>
